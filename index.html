    const playSuccessChime = () => {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(523.25, now); // C5
        osc1.frequency.exponentialRampToValueAtTime(659.25, now + 0.15); // E5
        osc1.frequency.exponentialRampToValueAtTime(783.99, now + 0.35); // G5
        osc1.frequency.exponentialRampToValueAtTime(1046.50, now + 0.5); // C6

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(261.63, now); // C4 chord warmth
        osc2.frequency.exponentialRampToValueAtTime(523.25, now + 0.5);

        gainNode.gain.setValueAtTime(0.01, now);
        gainNode.gain.linearRampToValueAtTime(0.25, now + 0.1);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

        osc1.connect(gainNode);
        osc2.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.95);
        osc2.stop(now + 0.95);
      } catch (e) {
        // AudioContext might be restricted until user gesture; safe fallback
      }
    };

    // --- Haversine Distance Calculation (in km) ---
    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Generate road path coordinates with simulated traffic segments between bus and pickup stop
    function generateTrafficRoute(startLat, startLng, endLat, endLng) {
      // Create 5 intermediate zig-zag realistic road waypoints
      const steps = 6;
      const points = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        // Add slight curvature like city street grid
        const curve = Math.sin(t * Math.PI) * 0.003;
        const lat = startLat + (endLat - startLat) * t + (i % 2 === 0 ? curve : -curve * 0.5);
        const lng = startLng + (endLng - startLng) * t + (i % 2 === 1 ? curve : -curve * 0.5);
        points.push([lat, lng]);
      }

      // Assign traffic conditions to each segment:
      // Green = Free Flow, Orange = Moderate, Red = Heavy Traffic
      const trafficSegments = [];
      const trafficTypes = ['green', 'green', 'orange', 'red', 'green', 'orange'];

      for (let i = 0; i < points.length - 1; i++) {
        const type = trafficTypes[i % trafficTypes.length];
        let color = '#10b981'; // Green
        let label = 'Smooth';
        if (type === 'orange') {
          color = '#f59e0b'; // Amber
          label = 'Moderate';
        } else if (type === 'red') {
          color = '#ef4444'; // Red
          label = 'Heavy Traffic';
        }
        trafficSegments.push({
          segmentIndex: i,
          from: points[i],
          to: points[i + 1],
          color: color,
          type: type,
          label: label
        });
      }

      return { points, trafficSegments };
    }

      // Auth Pop-up States: null | 'SIGN_UP' | 'LOG_IN'
      const [authModalMode, setAuthModalMode] = useState(null);

      // Sign Up Form (3 boxes: Username, Email ID, Password)
      const [signUpForm, setSignUpForm] = useState({

        password: ''
      });

      // Log In Form (2 boxes: Email ID / Username / User ID, Password)
      const [logInForm, setLogInForm] = useState({

      });

      // Database Inspector Modal State
      const [isDatabaseModalOpen, setIsDatabaseModalOpen] = useState(false);
      const [dbActiveTab, setDbActiveTab] = useState('bookings'); // 'bookings' | 'users' | 'markdown'
      const [copyNotification, setCopyNotification] = useState('');
      
      // Geolocation and Data State
      const [userLocation, setUserLocation] = useState(DEFAULT_USER_LOCATION);
      const [gpsActive, setGpsActive] = useState(false);
      const [gpsLoading, setGpsLoading] = useState(false);
      const [searchRadiusKm, setSearchRadiusKm] = useState(5.0);
      const [allBuses, setAllBuses] = useState([]);
      const [allStops, setAllStops] = useState([]);

      // Interaction State
      const [selectedBus, setSelectedBus] = useState(null);
      const [selectedStop, setSelectedStop] = useState(null);
      const [bookingDetails, setBookingDetails] = useState(null);
      const [currentPhotoIndex, setCurrentPhotoIndex] = useState(0);

      // User's Dedicated CARTO API Key
      const USER_CARTO_API_KEY = "cb1_5c98_1_e29b42e3a8d35e9d14a2af29";

      // Map Provider & Custom API Key State: Strictly default to CARTO Voyager with user's key
      const [tileProvider, setTileProvider] = useState('carto_voyager');
      const [apiKey, setApiKey] = useState(USER_CARTO_API_KEY);
      const [isMapSettingsOpen, setIsMapSettingsOpen] = useState(false);
      const [quickKeyInput, setQuickKeyInput] = useState('');
      const [tempApiKey, setTempApiKey] = useState(USER_CARTO_API_KEY);
      const [tempProvider, setTempProvider] = useState('carto_voyager');
      const tileLayerRef = useRef(null);

      // Ensure user's CARTO key and provider are stored and active on mount
      useEffect(() => {
        localStorage.setItem('buser_map_api_key', USER_CARTO_API_KEY);
        localStorage.setItem('buser_tile_provider', 'carto_voyager');
      }, []);

      // Live Tracking Dynamic Simulation State
      const [trackedBusPos, setTrackedBusPos] = useState(null);
      const [trackingProgress, setTrackingProgress] = useState(0); // 0 to 1
      const [estimatedWaitSecs, setEstimatedWaitSecs] = useState(320); // 5 mins 20 secs
      const [currentSpeed, setCurrentSpeed] = useState(34);
      const [trafficCondition, setTrafficCondition] = useState('Moderate Traffic');
      const [isTripCancelled, setIsTripCancelled] = useState(false);
      const [sosTriggered, setSosTriggered] = useState(false);

      // Collapsible Live Tracking Drawer State (true = collapsed / scrolled down to reveal map, false = expanded)
      const [isTrackingDrawerCollapsed, setIsTrackingDrawerCollapsed] = useState(false);
      const touchStartYRef = useRef(0);

      // Toggle drawer collapsed / expanded and smoothly re-center map view
      const toggleTrackingDrawer = (forceState) => {
        setIsTrackingDrawerCollapsed(prev => {
          const nextState = typeof forceState === 'boolean' ? forceState : !prev;
          if (mapInstanceRef.current && routeDataRef.current) {
            setTimeout(() => {
              try {
                const routeBounds = L.latLngBounds(routeDataRef.current.points);
                mapInstanceRef.current.fitBounds(routeBounds, {
                  paddingTopLeft: [70, 70],
                  paddingBottomRight: [70, nextState ? 90 : 340],
                  animate: true,
                  duration: 0.5
                });
              } catch(e) {}
            }, 60);
          }
          return nextState;
        });
      };

      const handleDrawerTouchStart = (e) => {
        touchStartYRef.current = e.touches[0].clientY;
      };

      const handleDrawerTouchEnd = (e) => {
        const diffY = e.changedTouches[0].clientY - touchStartYRef.current;
        if (diffY > 35 && !isTrackingDrawerCollapsed) {
          // Swiped down -> collapse drawer to reveal map
          toggleTrackingDrawer(true);
        } else if (diffY < -35 && isTrackingDrawerCollapsed) {
          // Swiped up -> expand drawer
          toggleTrackingDrawer(false);
        }
      };

      const handleDrawerWheel = (e) => {
        if (e.deltaY > 25 && !isTrackingDrawerCollapsed) {
          toggleTrackingDrawer(true);
        } else if (e.deltaY < -25 && isTrackingDrawerCollapsed) {
          toggleTrackingDrawer(false);
        }
      };

      // Map reference
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);
      const radiusCircleRef = useRef(null);
      const trafficPolylinesRef = useRef([]);
      const trackingMarkerRef = useRef(null);
      const routeDataRef = useRef(null);
      const trackingIntervalRef = useRef(null);

      // 1. Initialize user geolocation
      useEffect(() => {
        handleDetectLocation();
      }, []);

      const handleDetectLocation = () => {
        setGpsLoading(true);
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const newLoc = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                name: "Your Live GPS Location"
              };
              setUserLocation(newLoc);
              setGpsActive(true);
              setGpsLoading(false);
              initFleet(newLoc.lat, newLoc.lng);
            },
            (err) => {
              console.warn("GPS access denied or unavailable, using metropolitan center:", err.message);
              setGpsActive(false);
              setGpsLoading(false);
              initFleet(DEFAULT_USER_LOCATION.lat, DEFAULT_USER_LOCATION.lng);
            },
            { timeout: 7000, enableHighAccuracy: true }
          );
        } else {
          setGpsLoading(false);
          initFleet(DEFAULT_USER_LOCATION.lat, DEFAULT_USER_LOCATION.lng);
        }
      };

      const initFleet = (lat, lng) => {
        const buses = generateFleetData(lat, lng);
        const stops = generateBusStops(lat, lng);
        setAllBuses(buses);
        setAllStops(stops);
      };

      // Filter within 5km radius
      const nearestBuses = useMemo(() => {
        return allBuses.filter(b => b.distanceKm <= searchRadiusKm);
      }, [allBuses, searchRadiusKm]);

      const nearestStops = useMemo(() => {
        return allStops.filter(s => s.distanceKm <= searchRadiusKm);
      }, [allStops, searchRadiusKm]);

      // Tile Configuration Resolver
      const getTileConfig = (provider, key) => {
        const cleanKey = (key || USER_CARTO_API_KEY).trim();
        switch (provider) {
          case 'carto_voyager':
            return {
              url: `https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(cleanKey)}&api_key=${encodeURIComponent(cleanKey)}`,
              options: {
                maxZoom: 20,
                maxNativeZoom: 18,
                keepBuffer: 12,
                updateWhenIdle: false,
                updateWhenZooming: true,
                subdomains: 'abcd',
                attribution: '&copy; CARTO &copy; OpenStreetMap'
              }
            };
          case 'carto_dark':
            return {
              url: `https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(cleanKey)}&api_key=${encodeURIComponent(cleanKey)}`,
              options: {
                maxZoom: 20,
                maxNativeZoom: 18,
                keepBuffer: 12,
                updateWhenIdle: false,
                updateWhenZooming: true,
                subdomains: 'abcd',
                attribution: '&copy; CARTO &copy; OpenStreetMap'
              }
            };
          case 'esri':
            return {
              url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
              options: {
                maxZoom: 19,
                keepBuffer: 12,
                updateWhenIdle: false,
                updateWhenZooming: true,
                attribution: 'Tiles &copy; Esri'
              }
            };
          case 'mapbox':
            if (cleanKey && cleanKey.length > 5) {
              return {
                url: `https://api.mapbox.com/styles/v1/mapbox/streets-v11/tiles/{z}/{x}/{y}?access_token=${encodeURIComponent(cleanKey)}`,
                options: {
                  maxZoom: 19,
                  tileSize: 512,
                  zoomOffset: -1,
                  keepBuffer: 12,
                  updateWhenIdle: false,
                  updateWhenZooming: true,
                  attribution: '&copy; Mapbox'
                }
              };
            }
            return {
              url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
              options: {
                maxZoom: 19,
                keepBuffer: 12,
                updateWhenIdle: false,
                updateWhenZooming: true,
                attribution: '&copy; OpenStreetMap contributors'
              }
            };
          case 'osm':
          default:
            return {
              url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
              options: {
                maxZoom: 19,
                keepBuffer: 12,
                updateWhenIdle: false,
                updateWhenZooming: true,
                attribution: '&copy; OpenStreetMap contributors'
              }
            };
        }
      };

      const applyTileLayer = (map, provider, key) => {
        if (!map) return;
        if (tileLayerRef.current) {
          map.removeLayer(tileLayerRef.current);
          tileLayerRef.current = null;
        }
        const config = getTileConfig(provider, key);
        tileLayerRef.current = L.tileLayer(config.url, config.options).addTo(map);
        // Recalculate dimensions so tiles render across full canvas immediately
        map.invalidateSize({ debounceMoveEvents: true });
      };

      // 2. Initialize Leaflet Map
      useEffect(() => {
        if (!mapRef.current || mapInstanceRef.current) return;

        // Custom Leaflet basemap
        const map = L.map(mapRef.current, {
          center: [userLocation.lat, userLocation.lng],
          zoom: 14,
          zoomControl: true,
          attributionControl: false,
          trackResize: true
        });

        // Apply initial tile layer (CARTO Voyager with User's API Key)
        applyTileLayer(map, tileProvider, apiKey);

        // Layers for dynamic markers
        const markersGroup = L.layerGroup().addTo(map);
        markersLayerRef.current = markersGroup;

        mapInstanceRef.current = map;

        // Critical: Invalidate map size repeatedly to eliminate blank tiles on pan/zoom/resize
        const triggerInvalidate = () => {
          if (map) {
            map.invalidateSize({ debounceMoveEvents: true });
          }
        };

        const timer1 = setTimeout(triggerInvalidate, 60);
        const timer2 = setTimeout(triggerInvalidate, 250);
        const timer3 = setTimeout(triggerInvalidate, 600);
        const timer4 = setTimeout(triggerInvalidate, 1200);

        map.on('zoomend moveend resize viewreset', triggerInvalidate);
        window.addEventListener('resize', triggerInvalidate);

        return () => {
          clearTimeout(timer1);
          clearTimeout(timer2);
          clearTimeout(timer3);
          clearTimeout(timer4);
          map.off('zoomend moveend resize viewreset', triggerInvalidate);
          window.removeEventListener('resize', triggerInvalidate);
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      // 2b. Re-apply tile layer dynamically if provider or API key changes
      useEffect(() => {
        if (mapInstanceRef.current) {
          applyTileLayer(mapInstanceRef.current, tileProvider, apiKey);
        }
      }, [tileProvider, apiKey]);

      // 3. Render markers & 5km radius on map whenever state changes
      useEffect(() => {
        const map = mapInstanceRef.current;
        const layer = markersLayerRef.current;
        if (!map || !layer) return;

        layer.clearLayers();

        // A. Draw 5km radius circle around user
        if (radiusCircleRef.current) {
          map.removeLayer(radiusCircleRef.current);
        }
        const radiusCircle = L.circle([userLocation.lat, userLocation.lng], {
          radius: searchRadiusKm * 1000,
          color: '#3b82f6',
          weight: 2,
          opacity: 0.7,
          fillColor: '#3b82f6',
          fillOpacity: 0.05,
          dashArray: '6, 8'
        }).addTo(map);
        radiusCircleRef.current = radiusCircle;

        // B. User Marker (Pulsing blue indicator)
        const userIcon = L.divIcon({
          className: 'user-marker',
          html: `
            <div class="relative flex items-center justify-center w-8 h-8">
              <span class="absolute inline-flex h-full w-full rounded-full bg-blue-500 opacity-75 animate-ping"></span>
              <span class="relative inline-flex rounded-full h-5 w-5 bg-blue-600 border-2 border-white shadow-xl items-center justify-center">
                <span class="w-2 h-2 rounded-full bg-white"></span>
              </span>
            </div>
          `,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        L.marker([userLocation.lat, userLocation.lng], { icon: userIcon })
          .addTo(layer)
          .bindTooltip("You are here (GPS Active)", { permanent: false, direction: 'top', className: 'text-xs font-semibold' });

        // C. Draw Buses if not in live tracking mode
        if (appMode !== 'LIVE_TRACKING') {
          nearestBuses.forEach(bus => {
            const isSelected = selectedBus && selectedBus.id === bus.id;
            const busIcon = L.divIcon({
              className: `bus-marker ${isSelected ? 'bus-marker-pulse' : ''}`,
              html: `
                <div class="cursor-pointer group transform transition-all duration-300 hover:scale-110" style="display: flex; flex-direction: column; align-items: center; width: 130px;">
                  <div style="display: flex; align-items: center; gap: 6px; background: ${isSelected ? '#2563eb' : '#0f172a'}; border: 2px solid ${isSelected ? '#93c5fd' : '#334155'}; padding: 3px 8px 3px 4px; border-radius: 9999px; box-shadow: 0 10px 25px -3px rgba(0,0,0,0.7), 0 0 ${isSelected ? '16px rgba(59,130,246,0.7)' : '8px rgba(0,0,0,0.4)'};">
                    
                    <!-- High-Visibility Circular Bus Icon Badge -->
                    <div style="width: 26px; height: 26px; min-width: 26px; min-height: 26px; border-radius: 50%; background: ${isSelected ? '#ffffff' : '#3b82f6'}; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.4); flex-shrink: 0;">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="${isSelected ? '#2563eb' : '#ffffff'}" style="display: block; width: 16px; height: 16px; min-width: 16px; min-height: 16px;">
                        <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
                      </svg>
                    </div>

                    <!-- Route Code -->
                    <span style="color: #ffffff; font-weight: 800; font-size: 13px; font-family: 'Outfit', sans-serif; white-space: nowrap; line-height: 1;">
                      ${bus.routeNumber.split('-')[0]}
                    </span>

                    <!-- Distance Chip -->
                    <span style="background: rgba(16, 185, 129, 0.25); border: 1px solid rgba(16, 185, 129, 0.5); color: #34d399; font-weight: 700; font-size: 10px; padding: 1px 5px; border-radius: 5px; white-space: nowrap; line-height: 1.2;">
                      ${bus.distanceKm.toFixed(1)}km
                    </span>
                  </div>

                  <!-- Downward Pointer Arrow -->
                  <div style="width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid ${isSelected ? '#2563eb' : '#334155'}; margin-top: -1px;"></div>
                </div>
              `,
              iconSize: [130, 42],
              iconAnchor: [65, 40]
            });

            const marker = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(layer);
            marker.on('click', () => {
              if (appMode === 'STOP_SELECTION') return; // In stop selection, focus on stops
              setSelectedBus(bus);
              setAppMode('BUS_DETAILS_MODAL');
              setCurrentPhotoIndex(0);
              map.panTo([bus.lat, bus.lng], { animate: true, duration: 0.6 });
            });
          });
        }

        // D. Draw Bus Stops
        const isStopSelectionMode = appMode === 'STOP_SELECTION';

        nearestStops.forEach(stop => {
          const isChosen = selectedStop && selectedStop.id === stop.id;
          const stopIcon = L.divIcon({
            className: `stop-marker ${isStopSelectionMode ? 'stop-beacon-pulse' : ''}`,
            html: `
              <div class="cursor-pointer group transform transition-all duration-300 hover:scale-125">
                <div class="relative flex items-center justify-center">
                  ${isStopSelectionMode ? '<span class="absolute -inset-2 bg-amber-400 rounded-full animate-ping opacity-75"></span>' : ''}
                  <div class="w-8 h-8 rounded-xl shadow-xl flex items-center justify-center border-2 transition-colors ${
                    isChosen 
                      ? 'bg-emerald-600 border-white text-white shadow-emerald-500/50' 
                      : isStopSelectionMode 
                        ? 'bg-amber-500 border-white text-slate-950 font-bold scale-110 shadow-amber-500/50 animate-bounce' 
                        : 'bg-slate-800 border-slate-600 text-amber-400 hover:border-amber-400'
                  }">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                  </div>
                </div>
                ${isStopSelectionMode ? `
                  <div class="absolute left-1/2 -translate-x-1/2 top-9 bg-slate-900/95 backdrop-blur text-white border border-amber-400/80 px-2 py-0.5 rounded shadow-lg whitespace-nowrap text-[11px] font-bold">
                    ${stop.name} (${stop.distanceKm.toFixed(1)} km)
                  </div>
                ` : ''}
              </div>
            `,
            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });

          const stopMarker = L.marker([stop.lat, stop.lng], { icon: stopIcon }).addTo(layer);

          stopMarker.on('click', () => {
            if (isStopSelectionMode) {
              // User selects this stop for pickup!
              setSelectedStop(stop);
              handleStopSelected(stop);
            } else {
              // Just show info tooltip
              stopMarker.bindTooltip(`<b>${stop.name}</b><br/>Distance: ${stop.distanceKm.toFixed(1)} km (~${stop.walkTimeMinutes} min walk)<br/>Bus Lines: ${stop.activeLines.join(', ')}`, {
                direction: 'top',
                offset: [0, -10],
                className: 'bg-slate-900 text-white rounded-lg p-2 border border-slate-700 text-xs shadow-xl'
              }).openTooltip();
            }
          });
        });

      }, [nearestBuses, nearestStops, selectedBus, selectedStop, appMode, searchRadiusKm, userLocation]);

      // --- Authentication & Database Handlers ---

      // A. Handle Sign Up (3 boxes: Username, Email ID, Password)
      const handleSignUp = (e) => {
        if (e) e.preventDefault();
        setAuthError('');
        const username = signUpForm.username.trim();
        const email = signUpForm.email.trim();
        const password = signUpForm.password;

        if (!username) {
          setAuthError('Please enter a username.');
          return;
        }
        if (!email || !email.includes('@')) {
          setAuthError('Please enter a valid email address.');
          return;
        }
        if (!password || password.length < 4) {
          setAuthError('Password must be at least 4 characters.');
          return;
        }

        // Check uniqueness
        const duplicate = usersDb.find(u => 
          u.username.toLowerCase() === username.toLowerCase() || 
          u.email.toLowerCase() === email.toLowerCase()
        );
        if (duplicate) {
          setAuthError('An account with this username or email already exists. Please log in.');
          return;
        }

        // Generate unique 10-digit alphanumeric user ID
        const newUserId = generate10DigitAlphanumericId();
        const now = new Date().toISOString().split('T')[0];

        const newUser = {
          userId: newUserId,
          username: username,
          email: email,
          password: password,
          avatar: `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80`,
          createdAt: now,
          role: "Verified Commuter"
        };

        const updatedUsers = [newUser, ...usersDb];
        setUsersDb(updatedUsers);
        localStorage.setItem('buser_users_db', JSON.stringify(updatedUsers));
        
        setCurrentUser(newUser);
        localStorage.setItem('buser_current_user', JSON.stringify(newUser));

        setSignUpForm({ username: '', email: '', password: '' });
        setAuthModalMode(null);
        playSuccessChime();

        // "store the above mentioned detailes about the user in a seperate database in a tabular format,
        // and put the user back into the bus booking pop-up."
        if (selectedBus) {
          setAppMode('BUS_DETAILS_MODAL');
        }
      };

      // B. Handle Log In (2 boxes: Email ID / Username / User ID, Password)
      const handleLogIn = (e) => {
        if (e) e.preventDefault();
        setAuthError('');
        const idInput = logInForm.identifier.trim();
        const password = logInForm.password;

        if (!idInput) {
          setAuthError('Please enter your Email, Username, or 10-Digit User ID.');
          return;
        }
        if (!password) {
          setAuthError('Please enter your account password.');
          return;
        }

        // Verify credentials against database
        const match = usersDb.find(u => 
          (u.email.toLowerCase() === idInput.toLowerCase() ||
           u.username.toLowerCase() === idInput.toLowerCase() ||
           u.userId.toUpperCase() === idInput.toUpperCase()) &&
          u.password === password
        );

        if (match) {
          setCurrentUser(match);
          localStorage.setItem('buser_current_user', JSON.stringify(match));
          setLogInForm({ identifier: '', password: '' });
          setAuthModalMode(null);
          playSuccessChime();

          // "if its ture, the user is considered signed in and they are put back into the bus booking pop-up."
          if (selectedBus) {
            setAppMode('BUS_DETAILS_MODAL');
          }
        } else {
          // "if not, the user is asked to re-enter their details."
          setAuthError('Invalid credentials entered. Please check your username/email/ID and password, then re-enter.');
        }
      };

      // C. Handle Sign Out
      const handleSignOut = () => {
        setCurrentUser(null);
        localStorage.removeItem('buser_current_user');
        setAuthModalMode('LOG_IN');
      };

      // D. Generate GitHub-Compatible Markdown Database Table Representation
      const generateMarkdownDatabaseText = () => {
        let md = `# 🗄️ Buser Fleet Management - Passenger Bookings Database\n\n`;
        md += `> **Confidential Transit Logs • Tabular Passenger Records**  \n`;
        md += `> This file serves as the external database for passenger trip reservations, real-time telematic distances, and active street corridors across the city transit grid. Viewable natively as a table on the GitHub website.\n\n---\n\n`;
        md += `### 📋 Live Bookings Database Table\n\n`;
        md += `| Booking ID | Unique User ID (10-Digit Alphanumeric) | Bus Number | Bus Driver | Distance (User to Bus) | Distance (User to Bus Stop) | Picked Bus Stop Name | Estimated Time of Arrival (ETA) | Current Route (Road Name) | Booked At | Status |\n`;
        md += `| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n`;

        bookingsDb.forEach(b => {
          md += `| \`${b.bookingId}\` | **\`${b.userId}\`** | ${b.busNumber} | ${b.busDriver} | ${b.distanceToBus} | ${b.distanceToStop} | ${b.busStopName} | ${b.eta} | ${b.currentRoad} | ${b.bookedAt} | ${b.status} |\n`;
        });

        md += `\n---\n\n### 👥 Registered Users Master Database\n\n`;
        md += `| Unique User ID (10-Digit Alphanumeric) | Username | Registered Email | Account Created | Security Role |\n`;
        md += `| :--- | :--- | :--- | :--- | :--- |\n`;

        usersDb.forEach(u => {
          md += `| **\`${u.userId}\`** | \`${u.username}\` | \`${u.email}\` | ${u.createdAt} | ${u.role || 'Verified Commuter'} |\n`;
        });

        md += `\n---\n\n### 🔍 Database Schema Specifications\n\n`;
        md += `1. **\`Unique User ID\`**: 10-character alphanumeric unique identifier (e.g. \`A7X9K2P4Q1\`). Datatype: \`VARCHAR(10)\` / \`Alphanumeric\`.\n`;
        md += `2. **\`Bus Number\`**: Designation and corridor code of the booked transit vehicle (e.g. \`101-EXPRESS\`, \`204-AIRPORT\`).\n`;
        md += `3. **\`Bus Driver\`**: Full name of the assigned certified captain.\n`;
        md += `4. **\`Distance (User to Bus)\`**: Geodesic distance in kilometers from customer's GPS position to the bus.\n`;
        md += `5. **\`Distance (User to Bus Stop)\`**: Geodesic distance in kilometers from customer's GPS position to the selected pickup stop.\n`;
        md += `6. **\`Picked Bus Stop Name\`**: Official name of the designated transit shelter chosen by the customer.\n`;
        md += `7. **\`Estimated Time of Arrival (ETA)\`**: Computed wait time for bus arrival at the chosen stop.\n`;
        md += `8. **\`Current Route (Road Name)\`**: Specific urban arterial road, avenue, or highway through which the vehicle is traveling.\n`;

        return md;
      };

      const copyMarkdownToClipboard = () => {
        const mdText = generateMarkdownDatabaseText();
        navigator.clipboard.writeText(mdText).then(() => {
          setCopyNotification('Copied DATABASE.md to clipboard!');
          setTimeout(() => setCopyNotification(''), 3000);
        });
      };

      const downloadMarkdownFile = () => {
        const mdText = generateMarkdownDatabaseText();
        const blob = new Blob([mdText], { type: 'text/markdown;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', 'DATABASE.md');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 4. Handle "Book this bus" click inside Bus Info Pop-up
      const handleBookBusClick = () => {
        // As per specification:
        // "i also want you to add a pop up when a new user tries to book a bus.
        // this pop-up will contain 3 boxes where the user can set up an account on the app itself...
        // below all these boxes is an option to sign up and below that one is an option to log in...
        // and put the user back into the bus booking pop-up."
        if (!currentUser) {
          setAuthError('Please sign up or log in to complete your bus booking reservation.');
          setAuthModalMode('SIGN_UP');
          return;
        }

        // If user is authenticated, proceed to highlight stops
        setAppMode('STOP_SELECTION');
        
        // Pan/fit map nicely to show nearest stops
        if (mapInstanceRef.current && nearestStops.length > 0) {
          const bounds = L.latLngBounds(nearestStops.map(s => [s.lat, s.lng]));
          bounds.extend([userLocation.lat, userLocation.lng]);
          if (selectedBus) {
            bounds.extend([selectedBus.lat, selectedBus.lng]);
          }
          mapInstanceRef.current.fitBounds(bounds, { padding: [80, 80], maxZoom: 15, animate: true });
        }
      };

      // 5. Handle Stop Selection -> Opens Confirmation Modal with Tick Mark & Records to Database
      const handleStopSelected = (chosenStop) => {
        const currentUserId = currentUser ? currentUser.userId : "GUEST-USER";
        const etaMinutes = Math.max(3, Math.round(chosenStop.distanceKm * 4 + 2));
        const newBookingId = "BSR-" + Math.floor(100000 + Math.random() * 900000);
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0] + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

        // Build complete tabular database record
        const booking = {
          bookingId: newBookingId,
          userId: currentUserId, // 10-Digit Alphanumeric User ID
          busNumber: selectedBus.routeNumber,
          busDriver: selectedBus.driver.name,
          distanceToBus: `${selectedBus.distanceKm.toFixed(1)} km`,
          distanceToStop: `${chosenStop.distanceKm.toFixed(1)} km`,
          busStopName: chosenStop.name,
          eta: `${etaMinutes} mins`,
          currentRoad: selectedBus.currentRoadName || "Metro Arterial Corridor",
          bookedAt: dateStr,
          status: 'Active',
          bus: selectedBus,
          stop: chosenStop,
          otp: Math.floor(1000 + Math.random() * 9000)
        };

        // Append to Database
        const updatedBookings = [booking, ...bookingsDb];
        setBookingsDb(updatedBookings);
        localStorage.setItem('buser_bookings_db', JSON.stringify(updatedBookings));

        setBookingDetails(booking);
        playSuccessChime();
        setAppMode('CONFIRMATION_MODAL');
      };

      // 6. Handle Closing Confirmation Modal -> Launches Live Cab-Style Tracking Mode
      const handleCloseConfirmation = () => {
        // "closing this pop-up will allow the user to track the bus just like how its done with cabs
        // along with sections of the road highlighted that have traffic and at the lower part of the screen
        // will contain the approximate wait time"
        setAppMode('LIVE_TRACKING');
        startLiveTracking();
      };

      // 7. Live Tracking Simulation Engine
      const startLiveTracking = () => {
        if (!selectedBus || !selectedStop || !mapInstanceRef.current) return;

        const map = mapInstanceRef.current;

        // Clear existing traffic polylines
        trafficPolylinesRef.current.forEach(poly => map.removeLayer(poly));
        trafficPolylinesRef.current = [];

        // Generate realistic multi-segment path with traffic colors
        const routeData = generateTrafficRoute(
          selectedBus.lat, selectedBus.lng,
          selectedStop.lat, selectedStop.lng
        );
        routeDataRef.current = routeData;

        // Draw segmented polyline with traffic colors
        routeData.trafficSegments.forEach(seg => {
          // Glow border
          const glow = L.polyline([seg.from, seg.to], {
            color: seg.color,
            weight: 8,
            opacity: 0.35,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);

          // Core line
          const line = L.polyline([seg.from, seg.to], {
            color: seg.color,
            weight: 5,
            opacity: 0.95,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);

          trafficPolylinesRef.current.push(glow, line);
        });

        // Set initial bus position
        setTrackedBusPos([selectedBus.lat, selectedBus.lng]);
        setTrackingProgress(0);
        setEstimatedWaitSecs(280); // ~4 mins 40 secs

        // Fit map bounds to show full route smoothly
        const routeBounds = L.latLngBounds(routeData.points);
        map.fitBounds(routeBounds, { padding: [100, 100], animate: true });

        // Dynamic Moving Bus Marker
        const trackingBusIcon = L.divIcon({
          className: 'tracking-bus-marker',
          html: `
            <div class="relative flex items-center justify-center">
              <span class="absolute -inset-3 bg-blue-500 rounded-full animate-ping opacity-60"></span>
              <div style="width: 48px; height: 48px; background: #2563eb; color: #ffffff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2.5px solid #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="white" style="display: block; width: 22px; height: 22px; min-width: 22px;">
                  <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
                </svg>
                <span style="font-size: 10px; font-weight: 900; line-height: 1; font-family: 'Outfit', sans-serif;">${selectedBus.routeNumber.split('-')[0]}</span>
              </div>
            </div>
          `,
          iconSize: [48, 48],
          iconAnchor: [24, 24]
        });

        if (trackingMarkerRef.current) {
          map.removeLayer(trackingMarkerRef.current);
        }
        const trackingMarker = L.marker([selectedBus.lat, selectedBus.lng], { icon: trackingBusIcon }).addTo(map);
        trackingMarkerRef.current = trackingMarker;

        // Start step-by-step smooth animated ticker
        if (trackingIntervalRef.current) clearInterval(trackingIntervalRef.current);

        let progress = 0;
        const totalSteps = 200; // updates every 800ms
        const pts = routeData.points;

        trackingIntervalRef.current = setInterval(() => {
          progress += 1 / totalSteps;
          if (progress >= 1) {
            progress = 1;
            clearInterval(trackingIntervalRef.current);
            setEstimatedWaitSecs(0);
            return;
          }

          setTrackingProgress(progress);

          // Calculate current coordinate along multi-segment line
          const totalSegments = pts.length - 1;
          const currentSegIndex = Math.min(Math.floor(progress * totalSegments), totalSegments - 1);
          const segProgress = (progress * totalSegments) - currentSegIndex;

          const p1 = pts[currentSegIndex];
          const p2 = pts[currentSegIndex + 1];

          const curLat = p1[0] + (p2[0] - p1[0]) * segProgress;
          const curLng = p1[1] + (p2[1] - p1[1]) * segProgress;

          setTrackedBusPos([curLat, curLng]);
          if (trackingMarkerRef.current) {
            trackingMarkerRef.current.setLatLng([curLat, curLng]);
          }

          // Update speed & traffic conditions based on which segment we are on
          const currentSeg = routeData.trafficSegments[currentSegIndex];
          if (currentSeg) {
            if (currentSeg.type === 'red') {
              setTrafficCondition('Heavy Traffic (Congestion Ahead)');
              setCurrentSpeed(18 + Math.floor(Math.random() * 6));
            } else if (currentSeg.type === 'orange') {
              setTrafficCondition('Moderate Traffic (Moving Steadily)');
              setCurrentSpeed(28 + Math.floor(Math.random() * 8));
            } else {
              setTrafficCondition('Smooth Flow (Clear Roads)');
              setCurrentSpeed(42 + Math.floor(Math.random() * 10));
            }
          }

          // Decrement wait time
          setEstimatedWaitSecs(prev => Math.max(12, prev - 2));
        }, 800);
      };

      // Cleanup intervals
      useEffect(() => {
        return () => {
          if (trackingIntervalRef.current) clearInterval(trackingIntervalRef.current);
        };
      }, []);

      // Format seconds into "X min Y sec"
      const formatWaitTime = (seconds) => {
        if (seconds <= 0) return "Arriving Now!";
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        if (mins === 0) return `${secs} sec`;
        return `${mins} min ${secs < 10 ? '0' : ''}${secs} sec`;
      };

      // Reset to initial state
      const handleResetAll = () => {
        if (trackingIntervalRef.current) clearInterval(trackingIntervalRef.current);
        if (trackingMarkerRef.current && mapInstanceRef.current) {
          mapInstanceRef.current.removeLayer(trackingMarkerRef.current);
          trackingMarkerRef.current = null;
        }
        if (mapInstanceRef.current) {
          trafficPolylinesRef.current.forEach(poly => mapInstanceRef.current.removeLayer(poly));
          trafficPolylinesRef.current = [];
        }
        setAppMode('MAP_VIEW');
        setSelectedBus(null);
        setSelectedStop(null);
        setBookingDetails(null);
        setIsTripCancelled(false);
        setSosTriggered(false);
        setIsTrackingDrawerCollapsed(false);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.setView([userLocation.lat, userLocation.lng], 14, { animate: true });
        }
      };

      return (
        <div className="relative w-screen h-screen overflow-hidden bg-slate-950">

          {/* ======================================================== */}
          {/* THE LEAFLET MAP CANVAS (Full Bleed Viewport)             */}
          {/* ======================================================== */}
          <div id="map" ref={mapRef} className="absolute inset-0 w-full h-full z-0"></div>

          {/* ======================================================== */}
          {/* TOP BAR / NAVIGATION HEADER                             */}
          {/* ======================================================== */}
          <header className="absolute top-0 left-0 right-0 z-20 px-4 py-3 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 flex items-center justify-between shadow-2xl">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-emerald-400 p-0.5 shadow-lg shadow-blue-500/20 flex items-center justify-center">
                <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                  <span className="text-xl font-black bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">B</span>
                </div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg font-extrabold tracking-tight text-white font-heading">buser</h1>
                  <span className="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">
                    City Transit v2.4
                  </span>
                </div>
                <p className="text-[11px] text-slate-400 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Connected to Real-time Fleet System
                </p>
              </div>
            </div>

            {/* GPS & 5km Radius Badge */}
            <div className="flex items-center gap-2">
              <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                <svg className="w-3.5 h-3.5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
                  <path d="M2 12h20" />
                </svg>
                <span className="text-slate-300 font-medium">Radius:</span>
                <span className="font-bold text-blue-400">5.0 km</span>
              </div>

              <button
                onClick={handleDetectLocation}
                disabled={gpsLoading}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all shadow-md ${
                  gpsActive 
                    ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20' 
                    : 'bg-blue-600 text-white hover:bg-blue-500'
                }`}
                title="Refresh GPS Location"
              >
                <svg className={`w-3.5 h-3.5 ${gpsLoading ? 'animate-spin' : ''}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <polygon points="3 11 22 2 13 21 11 13 3 11" />
                </svg>
                <span className="hidden md:inline">{gpsActive ? 'GPS Locked' : 'Locate Me'}</span>
              </button>

              {/* Map & API Key Button */}
              <button
                onClick={() => {
                  setTempProvider(tileProvider);
                  setTempApiKey(apiKey);
                  setIsMapSettingsOpen(true);
                }}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 transition-all shadow-md"
                title="Configure Map Tiles & API Key"
              >
                <span className="text-amber-400">🗺️</span>
                <span className="hidden sm:inline">Map & API Key</span>
                {apiKey ? (
                  <span className="w-2 h-2 rounded-full bg-emerald-400" title="API Key Active"></span>
                ) : (
                  <span className="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1 py-0.2 rounded font-bold">
                    FREE
                  </span>
                )}
              </button>

              {/* Database Table Button */}
              <button
                onClick={() => setIsDatabaseModalOpen(true)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 hover:border-blue-500/50 transition-all shadow-md"
                title="View GitHub-Synced Tabular Transit Database"
              >
                <span className="text-blue-400">🗄️</span>
                <span className="hidden md:inline">Database</span>
              </button>

              {/* Top-Right Profile & Authentication Area */}
              {currentUser ? (
                /* WHEN SIGNED IN: Profile picture, username next to it, and "signed in" in small text below */
                <div 
                  onClick={() => {
                    setAuthError('');
                    setAuthModalMode('LOG_IN');
                  }}
                  className="flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-emerald-500/40 transition-all cursor-pointer shadow-md group"
                  title="Click your username to view account / sign in pop-up"
                >
                  <div className="relative shrink-0">
                    <img 
                      src={currentUser.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80"} 
                      alt={currentUser.username} 
                      className="w-8 h-8 rounded-full object-cover border-2 border-emerald-400 shadow group-hover:scale-105 transition-transform"
                    />
                    <span className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-slate-950 rounded-full"></span>
                  </div>
                  <div className="text-left flex flex-col justify-center">
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs font-bold text-white group-hover:text-blue-300 transition-colors leading-tight">
                        {currentUser.username}
                      </span>
                      <span className="text-[9px] font-mono font-bold px-1.5 py-0.2 bg-blue-500/20 text-blue-300 rounded border border-blue-500/30">
                        {currentUser.userId}
                      </span>
                    </div>
                    <span className="text-[10px] text-emerald-400 font-medium leading-tight flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
                      signed in
                    </span>
                  </div>
                </div>
              ) : (
                /* WHEN NOT SIGNED IN: Blank profile picture, user id, and "sign up here" in small text below */
                <div 
                  onClick={() => {
                    setAuthError('');
                    setAuthModalMode('SIGN_UP');
                  }}
                  className="flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 hover:border-blue-500/60 transition-all cursor-pointer shadow-md group"
                  title="Click to sign up and get your unique 10-digit User ID"
                >
                  {/* Blank profile picture silhouette */}
                  <div className="w-8 h-8 rounded-full bg-slate-800 border-2 border-dashed border-slate-500 flex items-center justify-center text-slate-400 group-hover:border-blue-400 group-hover:text-blue-400 transition-colors shrink-0">
                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                  </div>
                  <div className="text-left flex flex-col justify-center">
                    <span className="text-xs font-bold text-slate-300 group-hover:text-white transition-colors leading-tight">
                      ID: GUEST-USER
                    </span>
                    <span className="text-[10px] text-blue-400 font-semibold leading-tight flex items-center gap-1">
                      <span>👉</span>
                      sign up here
                    </span>
                  </div>
                </div>
              )}
            </div>
          </header>

          {/* ======================================================== */}
          {/* NOTIFICATION BANNER (When in Stop Selection Mode)        */}
          {/* ======================================================== */}
          {appMode === 'STOP_SELECTION' && (
            <div className="absolute top-16 left-4 right-4 z-20 max-w-lg mx-auto bg-gradient-to-r from-amber-500/90 to-amber-600/90 backdrop-blur-md text-slate-950 font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center justify-between border border-amber-300 animate-bounce-gentle">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-full bg-slate-950 text-amber-400 flex items-center justify-center text-sm shadow">
                  📍
                </div>
                <div>
                  <p className="text-sm font-extrabold text-slate-950">Select Pickup Bus Stop</p>
                  <p className="text-xs text-slate-900 font-medium">Click any highlighted stop on the map for your bus to arrive</p>
                </div>
              </div>
              <button
                onClick={() => setAppMode('MAP_VIEW')}
                className="px-2.5 py-1 text-xs bg-slate-950/20 hover:bg-slate-950/40 text-slate-950 rounded-lg transition-colors"
              >
                Cancel
              </button>
            </div>
          )}

          {/* ======================================================== */}
          {/* FLOATING MAP OVERLAYS & LEGEND                           */}
          {/* ======================================================== */}
          {appMode === 'MAP_VIEW' && (
              <div className="absolute top-20 left-4 z-10 hidden sm:flex flex-col gap-2">
                <div className="bg-slate-950/90 backdrop-blur-md p-3.5 rounded-2xl border border-slate-800 shadow-xl max-w-xs">
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Fleet Radar (5km Range)</div>
                  <div className="space-y-2">
                    <div className="flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2 text-slate-300">
                        <span className="w-3 h-3 rounded bg-blue-500 inline-block"></span>
                        <span>Available Buses</span>
                      </div>
                      <span className="font-extrabold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">
                        {nearestBuses.length} online
                      </span>
                    </div>
                    <div className="flex items-center justify-between text-xs">
                      <div className="flex items-center gap-2 text-slate-300">
                        <span className="w-3 h-3 rounded bg-amber-500 inline-block"></span>
                        <span>Designated Bus Stops</span>
                      </div>
                      <span className="font-extrabold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                        {nearestStops.length} nearby
                      </span>
                    </div>
                  </div>
                  <div className="mt-3 pt-2.5 border-t border-slate-800/80 text-[11px] text-slate-400 flex items-center gap-1.5">
                    <svg className="w-3.5 h-3.5 text-blue-400" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                    </svg>
                    <span>Tap any bus marker to inspect & book</span>
                  </div>
                </div>

                {/* Quick Map & API Key Widget */}
                <div className="bg-slate-950/95 backdrop-blur-md p-3.5 rounded-2xl border border-slate-800 shadow-xl max-w-xs space-y-2.5">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-bold text-slate-200 flex items-center gap-1.5">
                      <span>🗺️</span>

                      onClick={() => {
                        setAuthError('');
                        setAuthModalMode('LOG_IN');
                      }}
                      className="text-blue-400 hover:text-blue-300 font-bold underline ml-1"
                    >
                      Log In here →
                    </button>
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* STEP 5: LOG IN POP-UP (2 Boxes: Identifier, Password)    */}
          {/* ======================================================== */}
          {authModalMode === 'LOG_IN' && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div 
                className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 sm:p-7 shadow-2xl space-y-5 animate-in fade-in zoom-in-95 duration-200"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Modal Header */}
                <div className="flex items-center justify-between border-b border-slate-800 pb-3.5">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center font-bold text-lg shadow-inner">
                      🔐
                    </div>
                    <div>
                      <h3 className="text-lg font-black text-white font-heading">Log In to Buser</h3>
                      <p className="text-xs text-slate-400">Enter your credentials to continue booking</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => {
                      setAuthModalMode(null);
                      setAuthError('');
                    }}
                    className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors"
                  >
                    ✕
                  </button>
                </div>

                {/* Re-enter Details Alert if failed */}
                {authError && (
                  <div className="p-3.5 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs flex items-start gap-2.5">
                    <svg className="w-4 h-4 shrink-0 fill-current text-rose-400 mt-0.5" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"/>
                    </svg>
                    <div>
                      <span className="font-bold text-rose-200">Credentials Mismatch: </span>
                      <span>{authError}</span>
                    </div>
                  </div>
                )}

                {/* 2 Input Boxes as explicitly requested */}
                <form onSubmit={handleLogIn} className="space-y-4">
                  {/* Box 1: Email ID / Username / User ID */}
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                      <span>1. Email ID / Username / User ID</span>
                      <span className="text-[10px] text-slate-500 font-normal">Enter any of the three</span>
                    </label>
                    <div className="relative">
                      <input 
                        type="text"
                        required
                        value={logInForm.identifier}
                        onChange={(e) => setLogInForm({...logInForm, identifier: e.target.value})}
                        placeholder="e.g. rohit@example.com or A7X9K2P4Q1"
                        className={`w-full bg-slate-950 border rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:ring-1 transition-colors ${
                          authError ? 'border-rose-500/60 focus:border-rose-500 focus:ring-rose-500' : 'border-slate-800 focus:border-blue-500 focus:ring-blue-500'
                        }`}
                      />
                    </div>
                  </div>

                  {/* Box 2: Password */}
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center justify-between">
                      <span>2. Password</span>
                      <span className="text-[10px] text-slate-500 font-normal">Account password</span>
                    </label>
                    <div className="relative">
                      <input 
                        type="password"
                        required
                        value={logInForm.password}
                        onChange={(e) => setLogInForm({...logInForm, password: e.target.value})}
                        placeholder="Enter your account password"
                        className={`w-full bg-slate-950 border rounded-xl px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:ring-1 transition-colors ${
                          authError ? 'border-rose-500/60 focus:border-rose-500 focus:ring-rose-500' : 'border-slate-800 focus:border-blue-500 focus:ring-blue-500'
                        }`}
                      />
                    </div>
                  </div>

                  {/* Log In Button */}
                  <button
                    type="submit"
                    className="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm tracking-wide shadow-xl shadow-emerald-600/30 transition-all transform active:scale-95 flex items-center justify-center gap-2"
                  >
                    <span>Log In & Return to Bus</span>
                    <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                      <path d="M5 12h14" />
                      <path d="m12 5 7 7-7 7" />
                    </svg>
                  </button>
                </form>

                {/* Pre-populated Demo Account Helper */}
                <div className="p-3 rounded-xl bg-slate-950 border border-slate-800/80 text-[11px] text-slate-400 space-y-1.5">
                  <div className="text-slate-300 font-bold flex items-center justify-between">
                    <span>💡 Quick Demo Test Account:</span>
                    <button
                      type="button"
                      onClick={() => setLogInForm({ identifier: 'A7X9K2P4Q1', password: 'password123' })}
                      className="text-xs text-blue-400 hover:underline font-semibold"
                    >
                      Autofill Test User
                    </button>
                  </div>
                  <div className="flex flex-wrap gap-2 text-[10px] font-mono text-slate-300">
                    <span className="bg-slate-900 px-2 py-0.5 rounded border border-slate-800">ID: <b className="text-emerald-400">A7X9K2P4Q1</b></span>
                    <span className="bg-slate-900 px-2 py-0.5 rounded border border-slate-800">Pass: <b className="text-amber-400">password123</b></span>
                  </div>
                </div>

                {/* Option to Switch to Sign Up */}
                <div className="pt-2 text-center border-t border-slate-800 flex items-center justify-between text-xs">
                  <span className="text-slate-400">Don't have an account yet?</span>
                  <button
                    type="button"
                    onClick={() => {
                      setAuthError('');
                      setAuthModalMode('SIGN_UP');
                    }}
                    className="text-blue-400 hover:text-blue-300 font-bold underline"
                  >
                    Sign Up here →
                  </button>
                </div>

                {currentUser && (
                  <div className="pt-1 text-center">
                    <button
                      onClick={handleSignOut}
                      className="text-[11px] text-rose-400 hover:underline"
                    >
                      Sign Out from {currentUser.username} ({currentUser.userId})
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* STEP 6: EXTERNAL TABULAR DATABASE INSPECTOR MODAL        */}
          {/* ======================================================== */}
          {isDatabaseModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-5">
              <div 
                className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-200"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Modal Header */}
                <div className="px-6 py-4 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between sticky top-0 z-20">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 text-blue-400 flex items-center justify-center font-bold text-lg">
                      🗄️
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="text-base font-extrabold text-white">Buser Fleet Database</h3>
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">
                          DATABASE.md Synced
                        </span>
                      </div>
                      <p className="text-xs text-slate-400">External tabular database viewable natively on GitHub</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={copyMarkdownToClipboard}
                      className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 transition-colors shadow"
                      title="Copy Markdown Table for GitHub"
                    >
                      <svg className="w-3.5 h-3.5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                      </svg>
                      <span>Copy Markdown</span>
                    </button>

                    <button
                      onClick={downloadMarkdownFile}
                      className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold transition-colors shadow"
                      title="Download updated DATABASE.md file"
                    >
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" x2="12" y1="15" y2="3"/>
                      </svg>
                      <span>Download DATABASE.md</span>
                    </button>

                    <button 
                      onClick={() => setIsDatabaseModalOpen(false)}
                      className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-colors ml-1"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                {/* Sub-Header Tabs & Quick Feedback */}
                <div className="px-6 py-2.5 bg-slate-950/70 border-b border-slate-800 flex items-center justify-between text-xs">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setDbActiveTab('bookings')}
                      className={`px-3 py-1.5 rounded-xl font-bold transition-all ${
                        dbActiveTab === 'bookings'
                          ? 'bg-blue-600 text-white shadow-md'
                          : 'text-slate-400 hover:text-white bg-slate-900 border border-slate-800'
                      }`}
                    >
                      📋 Bookings Table ({bookingsDb.length})
                    </button>

                    <button
                      onClick={() => setDbActiveTab('users')}
                      className={`px-3 py-1.5 rounded-xl font-bold transition-all ${
                        dbActiveTab === 'users'
                          ? 'bg-blue-600 text-white shadow-md'
                          : 'text-slate-400 hover:text-white bg-slate-900 border border-slate-800'
                      }`}
                    >
                      👥 Users Master ({usersDb.length})
                    </button>

                    <button
                      onClick={() => setDbActiveTab('markdown')}
                      className={`px-3 py-1.5 rounded-xl font-bold transition-all ${
                        dbActiveTab === 'markdown'
                          ? 'bg-blue-600 text-white shadow-md'
                          : 'text-slate-400 hover:text-white bg-slate-900 border border-slate-800'
                      }`}
                    >
                      📄 GitHub Markdown Raw
                    </button>
                  </div>

                  {copyNotification && (
                    <span className="text-emerald-400 font-bold animate-fade-in flex items-center gap-1">
                      <span>✓</span> {copyNotification}
                    </span>
                  )}
                </div>

                {/* Tabular Database Content */}
                <div className="p-6 overflow-y-auto flex-1">
                  
                  {/* TAB 1: BOOKINGS TABULAR DATABASE */}
                  {dbActiveTab === 'bookings' && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between text-xs text-slate-400">
                        <span>All passenger bus bookings stored with 10-digit User ID and corridor road names:</span>
                        <span className="font-mono text-emerald-400">{bookingsDb.length} Total Records</span>
                      </div>

                      <div className="overflow-x-auto rounded-2xl border border-slate-800 shadow-inner">
                        <table className="w-full text-left text-xs text-slate-300 divide-y divide-slate-800">
                          <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px] tracking-wider">
                            <tr>
                              <th className="px-3.5 py-3 font-bold">Booking ID</th>
                              <th className="px-3.5 py-3 font-bold text-blue-400">Unique User ID</th>
                              <th className="px-3.5 py-3 font-bold">Bus No.</th>
                              <th className="px-3.5 py-3 font-bold">Driver</th>
                              <th className="px-3.5 py-3 font-bold">User → Bus</th>
                              <th className="px-3.5 py-3 font-bold">User → Stop</th>
                              <th className="px-3.5 py-3 font-bold">Picked Bus Stop</th>
                              <th className="px-3.5 py-3 font-bold text-amber-400">ETA</th>
                              <th className="px-3.5 py-3 font-bold text-emerald-400">Current Route (Road Name)</th>
                              <th className="px-3.5 py-3 font-bold">Booked At</th>
                              <th className="px-3.5 py-3 font-bold">Status</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 bg-slate-900/60 font-sans">
                            {bookingsDb.map((rec, i) => (
                              <tr key={i} className="hover:bg-slate-800/40 transition-colors">
                                <td className="px-3.5 py-3 font-mono font-bold text-white whitespace-nowrap">{rec.bookingId}</td>
                                <td className="px-3.5 py-3 font-mono font-bold text-blue-400 whitespace-nowrap bg-blue-500/5">
                                  {rec.userId}
                                </td>
                                <td className="px-3.5 py-3 whitespace-nowrap font-semibold">{rec.busNumber}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap">{rec.busDriver}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap">{rec.distanceToBus}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap">{rec.distanceToStop}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap font-medium text-slate-200">{rec.busStopName}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap font-bold text-amber-400">{rec.eta}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap font-mono text-emerald-300">{rec.currentRoad}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap text-slate-400 text-[11px]">{rec.bookedAt}</td>
                                <td className="px-3.5 py-3 whitespace-nowrap">
                                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                    rec.status === 'Active' 
                                      ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' 
                                      : 'bg-slate-800 text-slate-400'
                                  }`}>
                                    {rec.status}
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: USERS MASTER TABULAR DATABASE */}
                  {dbActiveTab === 'users' && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between text-xs text-slate-400">
                        <span>Master directory of registered commuters with 10-digit alphanumeric User IDs:</span>
                        <span className="font-mono text-blue-400">{usersDb.length} Registered Accounts</span>
                      </div>

                      <div className="overflow-x-auto rounded-2xl border border-slate-800 shadow-inner">
                        <table className="w-full text-left text-xs text-slate-300 divide-y divide-slate-800">
                          <thead className="bg-slate-950 text-slate-400 uppercase font-mono text-[10px] tracking-wider">
                            <tr>
                              <th className="px-4 py-3 font-bold text-blue-400">Unique User ID (10-Digit Alphanumeric)</th>
                              <th className="px-4 py-3 font-bold">Username</th>
                              <th className="px-4 py-3 font-bold">Registered Email</th>
                              <th className="px-4 py-3 font-bold">Created Date</th>
                              <th className="px-4 py-3 font-bold">Security Role</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/60 bg-slate-900/60">
                            {usersDb.map((u, i) => (
                              <tr key={i} className="hover:bg-slate-800/40 transition-colors">
                                <td className="px-4 py-3 font-mono font-black text-blue-400 whitespace-nowrap bg-blue-500/5">
                                  {u.userId}
                                </td>
                                <td className="px-4 py-3 font-bold text-white whitespace-nowrap flex items-center gap-2">
                                  <img src={u.avatar || "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80"} className="w-5 h-5 rounded-full object-cover" />
                                  <span>{u.username}</span>
                                </td>
                                <td className="px-4 py-3 font-mono text-slate-300 whitespace-nowrap">{u.email}</td>
                                <td className="px-4 py-3 text-slate-400 whitespace-nowrap">{u.createdAt}</td>
                                <td className="px-4 py-3 whitespace-nowrap">
                                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                    {u.role || 'Verified Commuter'}
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* TAB 3: GITHUB MARKDOWN RAW VIEW */}
                  {dbActiveTab === 'markdown' && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between text-xs text-slate-400">
                        <span>Native GitHub Markdown format as written to <code className="text-blue-400 bg-slate-950 px-1 py-0.5 rounded">DATABASE.md</code>:</span>
                        <button
                          onClick={copyMarkdownToClipboard}
                          className="text-xs text-blue-400 hover:underline font-bold"
                        >
                          Copy All
                        </button>
                      </div>

                      <pre className="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-slate-300 font-mono text-[11px] overflow-x-auto max-h-[50vh] leading-relaxed select-all">
                        {generateMarkdownDatabaseText()}
                      </pre>
                    </div>
                  )}

                </div>

                {/* Modal Footer */}
                <div className="px-6 py-3.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>Database connected & responsive</span>
                  </div>
                  <button
                    onClick={() => setIsDatabaseModalOpen(false)}
                    className="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold transition-colors"
                  >
                    Done
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<BuserApp />);
  </script>
</body>
</html>
